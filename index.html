<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>musle | Guess the song!</title>
    <link rel="icon" href="images/favicon.svg?v=2"/>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="styles.css"/>
</head>
<body>
    <main id="mainDiv" class="main">
        <h1 class="logo">musle</h1>

        <div id="guesses" class="guesses">
            <p id="guess1" class="guess"></p>
            <p id="guess2" class="guess"></p>
            <p id="guess3" class="guess"></p>
            <p id="guess4" class="guess"></p>
            <p id="guess5" class="guess"></p>
        </div>

        <section class="player">
            <div class="progress" aria-hidden="true">
                <span class="seg"></span>
                <span class="seg"></span>
                <span class="seg"></span>
                <span class="seg"></span>
                <span class="seg"></span>
            </div>
            <p class="timer"><span id="currentTime">0.0s</span> of <span id="stageTime">1s</span></p>

            <button id="playBtn" class="play" aria-label="Play snippet">
                <i id="playIcon" class="bi bi-play-fill"></i>
            </button>
        </section>

        <div class="controls">
            <input type="text" id="currentGuess" class="currentGuess" placeholder="Search for the song title" autocomplete="off">
            <div class="buttons">
                <button id="skipBtn" class="btn btn-skip">Skip</button>
                <button id="submitBtn" class="btn btn-submit">Guess</button>
            </div>
        </div>
    </main>
</body>
</html>
